name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Python offline test suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install light test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi "httpx>=0.24,<1.0" uvicorn python-multipart pydantic psycopg2-binary psutil openai numpy
      - name: Run offline test suite
        run: python test_all.py

  frontend:
    name: Next.js build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: ESLint
        run: npx next lint --no-cache 2>&1 || npm run lint
